---
name: StackScript Validator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 3'
  push:
    branches:
      - main
    paths:
      - 'deployment_scripts/**'

permissions:
  contents: read

concurrency:
  group: stackscript-validator
  cancel-in-progress: true

jobs:
  validate:
    name: Validate StackScripts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      results: ${{ steps.validate.outputs.results }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/stackscripts/requirements.txt

      - name: Validate StackScripts
        id: validate
        working-directory: .github/scripts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m stackscripts validate

  update:
    name: Update mismatched StackScripts
    needs: validate
    if: contains(needs.validate.outputs.results, '"MISMATCH"')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stackscript_production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/stackscripts/requirements.txt

      - name: Update StackScripts
        working-directory: .github/scripts
        env:
          VALIDATION_RESULTS: ${{ needs.validate.outputs.results }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STACKSCRIPT_API_TOKEN: ${{ secrets.STACKSCRIPT_API_TOKEN }}
        run: python -m stackscripts update --results "$VALIDATION_RESULTS"
