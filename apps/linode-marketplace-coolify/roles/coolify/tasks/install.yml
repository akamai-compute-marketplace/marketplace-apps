---
- name: Creating the Coolify data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: '9999'
    group: root
    mode: '0700'
  loop:
    - "{{ coolify_data_directory }}"
    - "{{ coolify_data_directory }}/applications"
    - "{{ coolify_data_directory }}/databases"
    - "{{ coolify_data_directory }}/backups"
    - "{{ coolify_data_directory }}/services"
    - "{{ coolify_data_directory }}/proxy"
    - "{{ coolify_data_directory }}/proxy/dynamic"
    - "{{ coolify_data_directory }}/sentinel"
    - "{{ coolify_data_directory }}/source"
    - "{{ coolify_data_directory }}/images"
    - "{{ coolify_data_directory }}/ssh/keys"
    - "{{ coolify_data_directory }}/ssh/mux"

- name: Downloading the Coolify compose and upgrade files
  get_url:
    url: "https://cdn.coollabs.io/coolify/{{ item.name }}"
    dest: "{{ coolify_data_directory }}/source/{{ item.name }}"
    mode: "{{ item.mode }}"
  loop:
    - { name: upgrade.sh, mode: '0755' }
    - { name: upgrade-postgres.sh, mode: '0755' }

- name: Ensure Coolify's ports are listening on localhost
  copy:
    dest: "{{ coolify_data_directory }}/source/docker-compose.custom.yml"
    mode: '0644'
    content: |
      services:
        coolify:
          ports: !override
            - "127.0.0.1:8000:8080"
            - "127.0.0.1:6001:6001"
            - "127.0.0.1:6002:6002"

- name: Writing the Coolify secrets and admin login env file
  template:
    src: templates/coolify-env.j2
    dest: "{{ coolify_data_directory }}/source/.env"
    mode: '0600'
    force: false
  no_log: true
