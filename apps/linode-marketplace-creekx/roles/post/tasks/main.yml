---
- name: Add addons
  ansible.builtin.import_role:
    name: addons
  when: add_ons != ['none']

- name: Ensure creekX's services are started and enabled
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: started
    enabled: true
  loop: [postgresql, caddy, creekx]

- name: Set up MOTD
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'

- name: Writing creds into file
  ansible.builtin.copy:
    dest: '/home/{{ username }}/.credentials'
    mode: '0600'
    owner: '{{ username }}'
    group: '{{ username }}'
    content: |
      Sudo Username: {{ username }}
      Sudo Password: {{ password }}
      creekX: https://{{ _domain }}
      creekX Owner Email: {{ soa_email_address }}
      creekX Owner Password: {{ creekx_owner_password }}
  no_log: true
