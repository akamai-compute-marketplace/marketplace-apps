---
# SSH, and the web ports a certificate needs before creekX starts. creekX's installer opens
# the rest itself (OBS 1935, RTSP 8554, SRT 8890, WebRTC 8189, UDP encoders, the relay).
- name: Configure UFW rules
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: tcp
  loop: ['22', '80', '443']

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
