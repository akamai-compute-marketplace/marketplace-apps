---
- name: Hash the WebAdmin password
  command: >-
    {{ ols_root }}/admin/fcgi-bin/admin_php -q
    {{ ols_root }}/admin/misc/htpasswd.php {{ webadmin_password }}
  register: webadmin_password_hash
  changed_when: false
  no_log: true

- name: Write the WebAdmin htpasswd file
  copy:
    content: "{{ webadmin_user }}:{{ webadmin_password_hash.stdout }}\n"
    dest: "{{ ols_root }}/admin/conf/htpasswd"
    owner: lsadm
    group: lsadm
    mode: '0600'
  no_log: true

- name: Remove the plaintext WebAdmin password hint file
  file:
    path: "{{ ols_root }}/adminpasswd"
    state: absent
