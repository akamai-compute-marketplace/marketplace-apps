---
- name: Install apt repository prerequisites
  apt:
    name: python3-apt
    state: present
    update_cache: true

- name: Create the apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add the LiteSpeed repository signing key
  get_url:
    url: http://rpms.litespeedtech.com/debian/lst_repo.gpg
    dest: /etc/apt/keyrings/litespeed.gpg
    mode: '0644'

- name: Add the NodeSource repository signing key
  get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'

- name: Add the LiteSpeed apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/litespeed.gpg] http://rpms.litespeedtech.com/debian/ {{ ansible_distribution_release }} main"
    filename: litespeed
    state: present

- name: Add the NodeSource apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_version }} nodistro main"
    filename: nodesource
    state: present
