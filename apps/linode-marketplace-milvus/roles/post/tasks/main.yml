---
- name: Set up MOTD
  template:
    src: motd.j2
    dest: /etc/motd
    mode: '0600'
    owner: '{{ username }}'
    group: '{{ username }}'

- name: Writing creds to file
  copy:
    dest: '/home/{{ username }}/.credentials'
    mode: '0600'
    owner: '{{ username }}'
    group: '{{ username }}'
    content: |
      Sudo Username: {{ username }}
      Sudo Password: {{ password }}
      # RustFS
      RustFS Username: {{ rustfs_username }}
      RustFS Password: {{ rustfs_password }}
      # Milvus
      Milvus Username: root
      Milvus Password: {{ milvus_password }}
