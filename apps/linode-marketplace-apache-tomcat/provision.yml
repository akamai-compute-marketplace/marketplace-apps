---
- name: Setting up environment
  hosts: localhost
  connection: local
  any_errors_fatal: true
  user: root
  vars_files: [group_vars/linode/vars]
  tasks:
    - name: Generating sudo user and password
      import_tasks: ../linode_helpers/roles/sudouser/tasks/main.yml

    - name: Generate Tomcat keystore password
      lineinfile:
        path: group_vars/linode/vars
        insertafter: EOF
        line: "tomcat_keystore_password: {{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      no_log: true
