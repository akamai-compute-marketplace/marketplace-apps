---
- name: Create Tomcat context configuration directory
  file:
    path: "{{ tomcat_install_dir }}/conf/Catalina/localhost"
    state: directory
    owner: root
    group: tomcat
    mode: '0750'

- name: Create Certbot ACME challenge directory
  file:
    path: "{{ tomcat_certbot_webroot }}/.well-known/acme-challenge"
    state: directory
    mode: '0755'

- name: Install Tomcat certificate challenge context
  template:
    src: acme-context.xml.j2
    dest: "{{ tomcat_install_dir }}/conf/Catalina/localhost/.well-known.xml"
    owner: root
    group: tomcat
    mode: '0640'

- name: Install Tomcat HTTPS redirect rules
  template:
    src: rewrite.config.j2
    dest: "{{ tomcat_install_dir }}/conf/Catalina/localhost/rewrite.config"
    owner: root
    group: tomcat
    mode: '0640'

- name: Configure Tomcat server
  template:
    src: server.xml.j2
    dest: "{{ tomcat_install_dir }}/conf/server.xml"
    owner: root
    group: tomcat
    mode: '0640'
  vars:
    tomcat_tls_enabled: false

- name: Install Tomcat systemd unit
  template:
    src: tomcat.service.j2
    dest: /etc/systemd/system/tomcat.service
    mode: '0644'

- name: Enable and start Tomcat
  systemd_service:
    name: tomcat
    state: started
    enabled: true
    daemon_reload: true
