---
- name: Remove bundled Tomcat webapps
  file:
    path: "{{ tomcat_install_dir }}/webapps/{{ item }}"
    state: absent
  loop: [ROOT, docs, examples, host-manager, manager]

- name: Deploy official Tomcat sample application as ROOT
  get_url:
    url: https://tomcat.apache.org/tomcat-11.0-doc/appdev/sample/sample.war
    dest: "{{ tomcat_install_dir }}/webapps/ROOT.war"
    owner: tomcat
    group: tomcat
    mode: '0640'
