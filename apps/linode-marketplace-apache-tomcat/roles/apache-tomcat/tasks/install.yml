---
- name: Install OpenJDK 17
  apt:
    name: openjdk-17-jdk
    state: present
    update_cache: true

- name: Create tomcat service account
  user:
    name: tomcat
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Tomcat installation directory
  file:
    path: "{{ tomcat_install_dir }}"
    state: directory
    owner: root
    group: tomcat
    mode: '0750'

- name: Download Tomcat archive
  get_url:
    url: "https://archive.apache.org/dist/tomcat/tomcat-11/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
    checksum: "sha512:https://archive.apache.org/dist/tomcat/tomcat-11/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz.sha512"
    mode: '0644'

- name: Extract Tomcat archive
  unarchive:
    src: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: "{{ tomcat_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1

- name: Set Tomcat ownership and permissions
  file:
    path: "{{ tomcat_install_dir }}"
    owner: root
    group: tomcat
    recurse: true
    mode: '0750'

- name: Make Tomcat runtime directories writable
  file:
    path: "{{ tomcat_install_dir }}/{{ item }}"
    state: directory
    owner: tomcat
    group: tomcat
    mode: '0750'
    recurse: true
  loop: [logs, temp, work, webapps]

- name: Remove bundled Tomcat welcome application
  file:
    path: "{{ tomcat_install_dir }}/webapps/ROOT"
    state: absent

- name: Deploy official Tomcat sample application as ROOT
  get_url:
    url: https://tomcat.apache.org/tomcat-11.0-doc/appdev/sample/sample.war
    dest: "{{ tomcat_install_dir }}/webapps/ROOT.war"
    owner: tomcat
    group: tomcat
    mode: '0640'
